name: Uptime check

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Every surface must answer 200
        run: |
          set -u
          FAILED=0
          for url in \
            https://app.cuidaradistancia.com/ \
            https://gastos.cuidaradistancia.com/ \
            https://inventario.cuidaradistancia.com/ \
            https://pagos.cuidaradistancia.com/ \
            https://reportes.cuidaradistancia.com/ \
            https://dashboard.cuidaradistancia.com/ \
            https://gastos-admin.cuidaradistancia.com/ \
            https://medico.cuidaradistancia.com/ ; do
            code=$(curl -s -o /dev/null -m 20 -w "%{http_code}" "$url" || echo "000")
            if [ "$code" = "200" ]; then
              echo "ok   $code $url"
            else
              echo "FAIL $code $url"
              FAILED=1
            fi
          done

          # The portal must still send its security headers.
          headers=$(curl -sI -m 20 https://app.cuidaradistancia.com/ | grep -ci "content-security-policy")
          if [ "$headers" -lt 1 ]; then
            echo "FAIL security headers missing on app.cuidaradistancia.com"
            FAILED=1
          else
            echo "ok   security headers present"
          fi

          # The retired hosts must stay dead.
          for gone in \
            cuidar-portal.marbaquero.workers.dev \
            cuidar-gastos.marbaquero.workers.dev \
            cuidar-inventario.marbaquero.workers.dev \
            cuidar-pagos.marbaquero.workers.dev \
            cuidar-reportes.marbaquero.workers.dev ; do
            code=$(curl -s -o /dev/null -m 15 -w "%{http_code}" "https://$gone/" || echo "000")
            if [ "$code" = "404" ]; then
              echo "ok   404 $gone (retired, as intended)"
            else
              echo "FAIL $code $gone is serving again"
              FAILED=1
            fi
          done

          exit $FAILED

      # Contract checks: the failures that happened by accident should be
      # detected on purpose. Each of these catches a real incident from 22-23 Nov.
      - name: Every app still loads the shared session module
        run: |
          set -u
          FAILED=0
          for url in https://inventario.cuidaradistancia.com/ \
                     https://pagos.cuidaradistancia.com/ \
                     https://reportes.cuidaradistancia.com/ \
                     https://dashboard.cuidaradistancia.com/ \
                     https://gastos-admin.cuidaradistancia.com/ \
                     https://medico.cuidaradistancia.com/ \
                     https://app.cuidaradistancia.com/cuidadores ; do
            page=$(curl -s -m 20 "$url?cb=$RANDOM")
            if echo "$page" | grep -q "cuidar-auth\.js\|installSharedStorage"; then
              echo "ok   session module referenced  $url"
            else
              echo "FAIL session module missing   $url"
              FAILED=1
            fi
            base="${url%/}"
            base="${base%/cuidadores}"
            mod=$(curl -s -m 20 "$base/cuidar-auth.js?cb=$RANDOM")  # bypass edge cache
            if echo "$mod" | grep -q "installSharedStorage"; then
              echo "ok   module current            $url"
            else
              echo "FAIL module stale or missing  $url"
              FAILED=1
            fi
          done
          exit $FAILED

      - name: No surface still points at a retired host
        run: |
          set -u
          FAILED=0
          for url in https://app.cuidaradistancia.com/ \
                     https://gastos.cuidaradistancia.com/ \
                     https://inventario.cuidaradistancia.com/ \
                     https://pagos.cuidaradistancia.com/ \
                     https://reportes.cuidaradistancia.com/ \
                     https://dashboard.cuidaradistancia.com/ \
                     https://gastos-admin.cuidaradistancia.com/ \
                     https://medico.cuidaradistancia.com/ ; do
            n=$(curl -s -m 20 "$url" | grep -c "marbaquero\.workers\.dev" || true)
            if [ "$n" -eq 0 ]; then
              echo "ok   no retired hosts         $url"
            else
              echo "FAIL $n retired-host links    $url"
              FAILED=1
            fi
          done
          exit $FAILED

      # The single line that separates the household apps from the public
      # internet is `run_worker_first = true` in the guard's wrangler.toml.
      # Without it, Cloudflare serves the static files before the worker, with
      # no passphrase. This asserts the gate is still in front.
      - name: The Guard still gates the personal apps
        run: |
          set -u
          body=$(curl -s -m 25 "https://guard.cuidaradistancia.com/gastos-admin/?cb=$RANDOM" || true)
          if echo "$body" | grep -qiE "Registrar gasto|Gastos de Mam|Reporte diario|Medicinas"; then
            echo "FAIL the Guard served app content without a passphrase"
            exit 1
          fi
          if echo "$body" | grep -qiE "Clave|passphrase|Contraseña"; then
            echo "ok   passphrase gate is in front of the personal apps"
          else
            echo "FAIL the Guard returned neither the app nor the gate"
            echo "$body" | head -c 200
            exit 1
          fi

      # These live behind the Guard now. If one reappears here, the personal
      # apps are back on the commercial domain.
      - name: Personal apps are absent from the commercial domain
        run: |
          set -u
          FAILED=0
          for path in /mama/ /Gastos-de-mama-admin/ /Gastos-de-mama-original/ /Pago-Cuidadoras/ /inventario-medicinas/ /reporte-rosita/ ; do
            code=""
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -m 20 -w "%{http_code}" "https://cuidaradistancia.com${path}?cb=$RANDOM" || echo 000)
              case "$code" in
                404|410|200|301|302|307|308) break ;;
                *) sleep $((attempt * 5)) ;;   # 5xx / timeout: GitHub propagating, retry
              esac
            done
            case "$code" in
              404|410) echo "ok   gone      $path" ;;
              200|301|302|307|308) echo "FAIL $code      $path is being served again"; FAILED=1 ;;
              *) echo "warn $code      $path unknown (GitHub not answering); not treated as a failure" ;;
            esac
          done
          exit $FAILED
