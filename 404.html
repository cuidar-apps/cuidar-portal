<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Página no encontrada — Cuidar a Distancia</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{--bg:#DCD0BD;--card:#FBF7EE;--ink:#1D2923;--mut:#5E6B62;--olive:#40583D;--line:#C9BBA4}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:var(--bg);color:var(--ink);display:grid;place-items:center;padding:24px;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .box{max-width:520px;text-align:center}
  .mark{width:44px;height:44px;border-radius:12px;background:var(--olive);color:#fff;display:grid;place-items:center;
        font:700 19px Georgia,serif;margin:0 auto 18px}
  h1{font:400 30px/1.2 Georgia,"Times New Roman",serif;margin:0 0 10px}
  p{color:var(--mut);line-height:1.6;margin:0 0 8px}
  .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  a.btn{display:inline-block;padding:11px 18px;border-radius:999px;text-decoration:none;font-weight:700;font-size:14px}
  a.primary{background:var(--olive);color:#fff}
  a.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
  .small{margin-top:18px;font-size:12.5px;color:var(--mut)}
</style>
</head>
<body>
  <div class="box">
    <div class="mark">C</div>
    <h1>Esta página no existe</h1>
    <p>El enlace que siguió no lleva a ningún lado. Puede volver al portal o escribirnos si llegó aquí desde un enlace nuestro.</p>
    <p class="small">This page doesn't exist.</p>
    <div class="acts">
      <a class="btn primary" href="https://app.cuidaradistancia.com/">Ir al portal</a>
      <a class="btn ghost" href="https://cuidaradistancia.com/">cuidaradistancia.com</a>
    </div>
    <p class="small"><a href="mailto:hola@cuidaradistancia.com" style="color:var(--olive)">hola@cuidaradistancia.com</a></p>
  </div>
</body>
</html>
